plugins { id 'com.android.application' }
android {
    namespace 'cn.local.winterbear'
    compileSdk 35
    compileSdkExtension 15
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.local.winterbear'
        minSdk 30
        targetSdk 35
        versionCode 216
        versionName '2.1.6'
        testInstrumentationRunner 'cn.local.winterbear.RuntimeRegression'
        // Opt in only for local emulator checks; delivered APKs keep the two ARM ABIs.
        ndk { abiFilters.addAll(project.hasProperty('emulatorTest') ? ['x86_64'] : ['arm64-v8a', 'armeabi-v7a']) }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'; signingConfig signingConfigs.debug } }
    sourceSets { androidTest.java.srcDir 'src/test/java' }
}
dependencies {
    // Generated from the pinned upstream source by tools/build_minimal_opencv.py.
    // A fresh source checkout can still build against the full upstream library.
    if (file('libs/opencv-minimal-4.12.0.aar').exists()) {
        implementation files('libs/opencv-minimal-4.12.0.aar')
    } else {
        implementation 'org.opencv:opencv:4.12.0'
    }
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
}

// Run the Android-independent state machine without Gradle's test worker argfile.
// JDK 17 on Windows can misread a UTF-8 worker classpath under a Chinese user path.
configurations { engineTestRuntime }
dependencies { engineTestRuntime 'junit:junit:4.13.2' }
tasks.register('testEngine', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(
        layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
        layout.buildDirectory.dir('intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes')
    ) + configurations.engineTestRuntime
    mainClass = 'org.junit.runner.JUnitCore'
    args 'cn.local.winterbear.HuntMarchesTest'
    args 'cn.local.winterbear.PresetOrderTest'
    args 'cn.local.automation.LayoutTransformTest'
    args 'cn.local.winterbear.ForegroundWindowsTest', 'cn.local.winterbear.OverlayRecoveryTest', 'cn.local.winterbear.ServiceConnectionStateTest'
    args 'cn.local.winterbear.BearOverlayGuardTest', 'cn.local.bullseye.FloatingGuardTest', 'cn.local.bullseye.SessionGuardTest', 'cn.local.winterbear.ModeGateTest', 'cn.local.winterbear.MarchCountTest', 'cn.local.winterbear.MarchFlowTest', 'cn.local.winterbear.RallyOrderTest', 'cn.local.winterbear.GestureGateTest', 'cn.local.winterbear.MarchSimulationTest', 'cn.local.winterbear.LiveMapCheckTest', 'cn.local.winterbear.TroopCountTest', 'cn.local.winterbear.ForegroundGateTest', 'cn.local.winterbear.HuntFlowTest'
    systemProperty 'simulationReportDir', layout.buildDirectory.dir('reports/simulation').get().asFile.absolutePath
}
